<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Passcode - Flix</title>
    <script src="https://kit.fontawesome.com/7183df4a39.js" crossorigin="anonymous"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            color-scheme: dark;
            --bg: #07070a;
            --text: #fbfbfd;
            --muted: #a8afbd;
            --line: rgba(255, 255, 255, 0.12);
            --red: #e5092f;
            --red-hot: #ff3858;
            --teal: #27d1b4;
            --amber: #f6c453;
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 18% 8%, rgba(229, 9, 47, 0.2), transparent 30rem),
                radial-gradient(circle at 86% 16%, rgba(39, 209, 180, 0.12), transparent 24rem),
                linear-gradient(180deg, #151019 0, #09090c 34rem, var(--bg) 100%);
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
            background-size: 54px 54px;
            mask-image: linear-gradient(to bottom, black, transparent 78%);
            animation: grid-drift 16s linear infinite;
        }

        .auth-shell {
            width: min(100%, 440px);
            animation: shell-in 700ms cubic-bezier(.2, .8, .2, 1) both;
        }

        .brand-lockup {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 22px;
            animation: fade-up 620ms ease both 120ms;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 58px;
            height: 58px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 10px;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent 42%),
                linear-gradient(135deg, var(--red-hot), #9d071f);
            color: #fff;
            font-size: 1.3rem;
            font-weight: 950;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.22),
                0 18px 36px rgba(229, 9, 47, 0.34);
        }

        .brand-copy h1 {
            margin: 0;
            font-size: 2rem;
            line-height: 1;
        }

        .brand-copy p {
            margin: 6px 0 0;
            color: var(--muted);
        }

        #passcode-form {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 26px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.04)),
                rgba(7, 7, 10, 0.82);
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.48);
            backdrop-filter: blur(20px);
            animation: fade-up 640ms ease both 220ms;
        }

        #passcode-form::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(229, 9, 47, 0.12), transparent 42%, rgba(39, 209, 180, 0.08));
        }

        #passcode-form > * {
            position: relative;
        }

        h2 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 0;
        }

        .form-copy {
            margin: -8px 0 2px;
            color: var(--muted);
            line-height: 1.5;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }

        #passcode-input {
            width: 100%;
            height: 52px;
            padding: 0 16px 0 46px;
            border: 1px solid var(--line);
            border-radius: 8px;
            outline: none;
            color: var(--text);
            background: rgba(255, 255, 255, 0.075);
            font-size: 1rem;
            transition: border-color 0.18s, box-shadow 0.18s, background-color 0.18s;
        }

        #passcode-input:focus {
            border-color: rgba(255, 56, 88, 0.72);
            background: rgba(255, 255, 255, 0.105);
            box-shadow: 0 0 0 4px rgba(229, 9, 47, 0.13);
        }

        #passcode-input::placeholder {
            color: #858d9d;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 52px;
            border: 0;
            border-radius: 8px;
            color: white;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.18), transparent 42%),
                linear-gradient(135deg, var(--red-hot), var(--red));
            font-weight: 850;
            cursor: pointer;
            box-shadow: 0 18px 42px rgba(229, 9, 47, 0.24);
            transition: transform 0.18s, box-shadow 0.18s, filter 0.18s;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
            box-shadow: 0 22px 54px rgba(229, 9, 47, 0.32);
        }

        button:active {
            transform: translateY(0);
        }

        #error-message {
            display: none;
            margin: 0;
            padding: 10px 12px;
            border: 1px solid rgba(255, 56, 88, 0.34);
            border-radius: 8px;
            color: #ffd9df;
            background: rgba(229, 9, 47, 0.12);
        }

        #error-message.is-visible {
            display: block;
            animation: shake 360ms ease both;
        }

        @keyframes shell-in {
            from {
                opacity: 0;
                transform: scale(0.96);
                filter: blur(8px);
            }
            to {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes grid-drift {
            from {
                background-position: 0 0, 0 0;
            }
            to {
                background-position: 0 54px, 54px 0;
            }
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-6px);
            }
            50% {
                transform: translateX(5px);
            }
            75% {
                transform: translateX(-3px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before {
                animation-duration: 1ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 1ms !important;
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 16px;
            }

            #passcode-form {
                padding: 22px;
            }

            .brand-lockup {
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <main class="auth-shell" aria-label="Passcode access">
        <div class="brand-lockup">
            <span class="brand-mark">F</span>
            <div class="brand-copy">
                <h1>Flix</h1>
                <p>Private screening room</p>
            </div>
        </div>

        <form id="passcode-form">
            <h2>Enter passcode</h2>
            <p class="form-copy">Unlock your movies and shows.</p>
            <label class="input-wrap" for="passcode-input">
                <i class="fas fa-lock"></i>
                <input type="password" id="passcode-input" placeholder="Passcode" autocomplete="current-password" autofocus>
            </label>
            <button type="submit">
                Continue
                <i class="fas fa-arrow-right"></i>
            </button>
            <p id="error-message" aria-live="polite">Incorrect passcode. Please try again.</p>
        </form>
    </main>

    <script src="scripts/passcode.js"></script>
</body>
</html>
