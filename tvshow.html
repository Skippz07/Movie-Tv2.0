<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Show Details | Flix</title>
    <meta name="description" content="Explore TV series, seasons, episodes, cast and recommendations on Flix.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#07070a">
    <meta name="color-scheme" content="dark">
    <link rel="canonical" href="https://shows4u.vercel.app/tvshow.html">
    <meta property="og:title" content="TV Show Details | Flix">
    <meta property="og:description" content="Explore TV series, seasons, episodes, cast and recommendations on Flix.">
    <meta property="og:url" content="https://shows4u.vercel.app/tvshow.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Flix">
    <meta property="og:image" content="https://shows4u.vercel.app/icons/icon-512.png">
    <meta name="twitter:card" content="summary">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
  <script type="module" src="scripts/site.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link rel="stylesheet" href="stylesheets/tvshow.css">
  <script src="scripts/passcode.js"></script>

<link rel="stylesheet" href="stylesheets/site.css">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
  <div id="background"></div>
  <button id="back-button" type="button" aria-label="Back">&#8592;</button>
  <div id="iframe-container" class="iframe-collapsed">
    <div class="player-topbar">
      <button class="player-back-button" type="button" aria-label="Back to home">&#8592;</button>
      <span class="player-title">Now Playing</span>
      <button class="player-fullscreen-button" type="button" aria-label="Enter fullscreen" title="Enter fullscreen" aria-pressed="false"><i class="fas fa-expand" aria-hidden="true"></i></button>
      <span class="player-fullscreen-status" role="status"></span>
    </div>
    <div id="iframe-loading" class="iframe-loading hidden" aria-hidden="true">
      <span class="iframe-loading-spinner"></span>
      <span class="iframe-loading-text">Loading…</span>
    </div>
    <aside class="server-rail" aria-label="Video servers">
      <span class="server-rail-title">Servers</span>
      <div id="server-rail-list" class="server-rail-list"></div>
    </aside>
    <iframe
      id="video-frame"
      title="Episode player"
      allow="autoplay; encrypted-media; fullscreen *; picture-in-picture"
      allowfullscreen
    ></iframe>
  </div>
  <p id="embed-status-text" class="embed-status" aria-live="polite"></p>
  <main id="main-content" tabindex="-1"><div id="content">
    <div id="info-skeleton" class="detail-skeleton" aria-busy="true">
      <div class="skeleton skeleton-poster"></div>
      <div class="detail-skeleton-text">
        <div class="skeleton skeleton-line skeleton-line-lg"></div>
        <div class="skeleton skeleton-line skeleton-line-sm"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line skeleton-line-short"></div>
      </div>
    </div>

    <div id="info-container" class="hidden-until-ready">
      <img id="poster" width="500" height="750" fetchpriority="high" alt="TV show poster" loading="eager" decoding="async">
      <div id="details">
        <h1 id="title"></h1>
        <div id="info-metadata">
          <p id="rating"></p>
          <p id="release-date"></p>
        </div>
        <p id="description"></p>
        <button id="play-button" type="button">Focus player</button>
      </div>
    </div>

    <div id="controls-row" class="controls-row hidden-until-ready">
      <div id="server-selection">
        <label for="server-select">Server</label>
        <select id="server-select"></select>
      </div>
      <div id="season-episode-selection">
        <label for="season-select">Season</label>
        <select id="season-select" disabled></select>
      </div>
    </div>

    <div id="episode-list" class="episode-list-host" aria-live="polite"></div>
    <div id="episode-skeleton" class="episode-skeleton hidden" aria-hidden="true">
      <div class="skeleton skeleton-episode-row"></div>
      <div class="skeleton skeleton-episode-row"></div>
      <div class="skeleton skeleton-episode-row"></div>
    </div>

    <div id="actors-container" class="lazy-section">
      <h2>Actors</h2>
      <div id="actors-list" class="skeleton-grid"></div>
    </div>

    <div id="recommendations-container" class="lazy-section">
      <h2>You May Also Like</h2>
      <div id="recommendations-list" class="skeleton-grid"></div>
    </div>
  </div>
  </main>
  <script type="module" src="scripts/tvshow.js"></script>
  <script type="module" src="scripts/playerFullscreen.js"></script>
<footer class="site-footer"><a href="/index.html">Browse titles</a><a href="/saved.html">Saved titles</a><button id="install-app" type="button" hidden>Install Flix</button></footer>
<noscript><p>Flix needs JavaScript to load titles. Please enable it in your browser.</p></noscript>
</body>
</html>
